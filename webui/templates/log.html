{% extends "base.html" %}
{% block title %}{{ name }} - fantasy-sim{% endblock %}
{% block body %}
<h1>{{ name }} <span class="muted small">last {{ rows|length }} of {{ total }} rows, newest first</span></h1>
<p class="small"><a href="/logs/{{ name }}?n=50">50</a> &middot; <a href="/logs/{{ name }}?n=200">200</a> &middot; <a href="/logs/{{ name }}?n=1000">1000</a> &middot; <a href="{{ link }}?raw=1">raw file</a></p>
<pre>{% for r in rows %}{{ r|real }}
{% endfor %}</pre>
{% endblock %}
