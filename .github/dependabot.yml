# Dependabot for the pinned pip requirements.
#
# The pins are load-bearing here, so this config is deliberately conservative:
#   * the golden master's hashes are byte-exact to the generating numpy/scipy build's
#     float behavior -- a numeric-stack bump that changes a single ulp fails the golden
#     step in CI, and that is the REVIEW, not an obstacle: merge such a PR only with a
#     deliberate golden regeneration in the same change (release policy: that can be a
#     MAJOR-adjacent decision, never an auto-merge);
#   * hypothesis is pinned < 6.120 on purpose (6.165 fails inside its own engine on
#     Python 3.10.0 -- see CLAUDE.md) and is ignored below until that pin is revisited
#     on a later 3.10.x.
# Monthly cadence: this is a modelling project with a frozen runtime, not a service
# chasing CVEs; a small, reviewable batch beats a weekly drip.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "hypothesis"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
