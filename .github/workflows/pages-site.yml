# The public copy of the website on GitHub Pages (owner, 2026-09-30) -- it replaced the legacy
# sample report and its pages-sample workflow.
#
# What is published: the web UI's simple view, from the owner's team's point of view, as static
# pages (scripts.build_public_site / webui.static_site). Pseudonyms only, no images, and nothing
# that needs a server: no Tools, no Chat, no live scores.
#
# Which data: the latest OFFICIAL run's. canonical-run keeps its data as the `site-data`
# artifact after a canonical weekly report, and this workflow runs when that workflow finishes
# (and on a push that changes the site's code, rebuilt from the same data). Until an official
# run has kept its data -- the first days after this landed -- it syncs and simulates here
# instead, so the site is never empty. That stand-in sync runs WITHOUT the odds key, on
# purpose: the account's odds credits are a monthly budget (it ran out on 2026-09-30), and a
# rebuild on every push to webui/ is no place to spend them. Those builds use the ratings
# model's game environments instead of real lines, until the next official run's data.
#
# The gate: build_public_site takes every real team name, username and league id from Sleeper
# and refuses to publish on a single whole-word match anywhere in the site.
name: pages-site
on:
  workflow_run:
    workflows: [canonical-run]
    types: [completed]
  push:
    branches: [main]
    paths:
      - webui/**
      - scripts/build_public_site.py
      - fantasy_sim/config.py
      - .github/workflows/pages-site.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # after canonical-run: only when it succeeded (a skipped or failed run kept no new data)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
      SLEEPER_LEAGUE_ID_2025: ${{ secrets.SLEEPER_LEAGUE_ID_2025 }}
      SLEEPER_LEAGUE_ID_2024: ${{ secrets.SLEEPER_LEAGUE_ID_2024 }}
      ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
      # no ODDS_API_KEY: see the header -- the stand-in sync spends no odds credits
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned requirements (and Flask, which renders the pages)
        run: |
          python -m pip install -r requirements.txt
          python -m pip install Flask==3.1.3 Jinja2==3.1.6 Werkzeug==3.1.8 MarkupSafe==3.0.3 itsdangerous==2.2.0 click==8.5.0 blinker==1.9.0

      - name: The latest official run's data
        id: data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=""
          for id in $(gh run list --repo "${{ github.repository }}" --workflow canonical-run.yml --status success --limit 40 --json databaseId --jq '.[].databaseId'); do
            has=$(gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" --jq '[.artifacts[] | select(.name == "site-data" and .expired == false)] | length')
            if [ "$has" != "0" ]; then
              found="$id"
              break
            fi
          done
          if [ -n "$found" ]; then
            gh run download "$found" --repo "${{ github.repository }}" -n site-data -D data
            echo "official=true" >> "$GITHUB_OUTPUT"
            echo "Using the data of official run $found"
          else
            echo "official=false" >> "$GITHUB_OUTPUT"
            echo "No official run has kept its data yet; syncing and simulating here instead."
          fi

      - name: No official run yet -- sync and simulate here instead
        if: steps.data.outputs.official != 'true'
        run: |
          python -m scripts.run_sync --allow-fallback
          python -m scripts.run_simulation

      - name: Build the site (leak-checked before anything is published)
        run: python -m scripts.build_public_site --out _site

      - name: Upload the site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Clear the failure alarm on success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Automation failure: pages-site"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue close "$num" --comment "Recovered: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} succeeded."
          fi

      - name: Alarm on failure (issue -> phone)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Automation failure: pages-site"
          link="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The pages-site run failed: $link

          At risk: only the public site's freshness (it keeps serving the previous build); no data is involved. A failed leak check refuses to publish on purpose -- read the step's log before anything else.

          This issue auto-closes when a run succeeds."
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again: $link"
          else
            gh issue create --title "$title" --body "$body"
          fi
