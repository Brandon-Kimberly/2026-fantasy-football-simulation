# CI: full suite + golden master on every push and PR.
#
# Runner is WINDOWS on purpose: the golden master's hashes are byte-exact to the
# generating platform's libm (tests/golden_master.py's documented platform lock; the
# _meta block records Windows). Running on Linux would either fail the goldens on float
# repr differences or force tolerance-based comparison, which would surrender the
# byte-exactness that is Phase 0's entire guarantee. Public repo: minutes are free.
#
# R1 note (AUDIT_PLAN.md): the project's own machine has a load-dependent CPU fault, so a
# green run HERE -- an independent, fault-free box -- is meaningful evidence about the
# code beyond gating commits. Hermeticity was proven before this workflow existed: the
# suite passes with socket.connect disabled (0 network attempts) and from a fresh clone
# with no synced data (473 OK, skipped=3: the live-ingestion opt-in plus two graceful
# data-absent skips).
name: ci
on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt
      - name: Full suite under branch coverage
        run: |
          python -m coverage run -m unittest discover tests
          python -m coverage report
      - name: Coverage ratchet (fantasy_sim package; committed floor, 0.5-point band)
        # The band exists because a zero-tolerance floor turns rounding noise into build
        # failures -- the learn-to-ignore-it failure mode. The GATE is scoped to the
        # fantasy_sim package (2026-09-03, second incident of the same class): the repo
        # total includes standalone milestone scripts that are 0%-covered BY DESIGN
        # (scripts/run_behavior_check, scripts/make_sample_report run at milestones, not
        # in the suite), so every new one sank the total and broke the gate by
        # construction. scripts/ stays measured and visible in the report above; the
        # ratchet protects the package where the model lives. The floor only moves by a
        # deliberate commit, measured on the exact tree being committed.
        run: |
          $floor = [double](Get-Content coverage_floor.txt)
          $total = [double](python -m coverage report --include="fantasy_sim/*" --format=total)
          Write-Output "fantasy_sim coverage $total vs committed floor $floor (tolerance 0.5)"
          if ($total -lt ($floor - 0.5)) { Write-Error "fantasy_sim coverage $total is more than 0.5 below the committed floor $floor"; exit 1 }
      - name: Golden master (byte-exact reproducibility harness)
        run: python -m unittest tests.test_golden_master
