# F36 tier 2 (2026-09-04): the automated canonical run. Fires twice per window
# (primary + retry); every firing first asks windows_watch whether a window is OPEN and
# uncovered -- if not, it exits quietly, which makes retries and local/runner
# coexistence free (a local canonical run means the runner does nothing).
#
# The DEGRADED-judgment caveat (F36's real objection) is mechanical here:
#   ABORT         (sync-stage STALE)  -> fail loud, remediation issue, nothing written
#   REPORT_ONLY   (forecast-affecting degradation, or unrecognized -- conservative)
#                 -> report runs, uploads as an ARTIFACT, no canonical row committed
#   CANONICAL_OK  (only known benign residents) -> weekly_report --canonical; its own
#                 logs_push step commits and pushes the canonical predictions row
# In every branch the tracked logs are committed right after the sync (the tier-1.5
# capture duty), so the irreplaceable data lands before anything can fail downstream.
#
# windows-latest on purpose: the platform every audited number was produced on; CI
# already proves the suite and byte-exact goldens there. Fire times sit hours inside
# each window in BOTH DST regimes (width over offsets, as everywhere else):
#   Sunday   12:30 + 14:30 UTC  vs deadline 17:00 (PDT) / 18:00 (PST) -- worst case
#            (1h cron lag + ~35 min run) still leaves ~2.5h spare
#   Thursday 13:00 + 17:30 UTC  vs the usual ~00:20 Friday UTC kickoff
#   Tuesday  15:00 + 20:00 UTC  vs Wednesday 07:00/08:00 UTC waiver clear
name: canonical-run
on:
  schedule:
    - cron: "0 13 * * 4"
    - cron: "30 17 * * 4"
    - cron: "30 12 * * 0"
    - cron: "30 14 * * 0"
    - cron: "0 15 * * 2"
    - cron: "0 20 * * 2"
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          auto = respect the coverage check (a covered window exits quietly).
          force-report = run the FULL chain report-only even when covered -- never
          commits a canonical row, so a test run cannot supersede a real record.
          force-canonical = run even when covered AND commit the canonical row if the
          gate passes -- the new row SUPERSEDES the window's existing record
          (last-canonical-wins). Deliberate replacement only, e.g. re-quoting a
          baseline with the current engine before kickoff (owner, 2026-09-05).
        default: auto
        type: choice
        options: [auto, force-report, force-canonical]

permissions:
  contents: write
  issues: write

jobs:
  canonical:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MODE: ${{ inputs.mode || 'auto' }}
      SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
      ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt

      - name: Is a window open and uncovered?
        id: watch
        shell: bash
        run: |
          python -m scripts.windows_watch > watch.json
          cat watch.json
          n=$(jq '.actionable | length' watch.json)
          if [ "$MODE" = "force-report" ] || [ "$MODE" = "force-canonical" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            jq -n --arg m "manual-$MODE" '{name: $m, deadline: "(n/a -- manual dispatch)", hours_left: 0}' > window.json
            echo "$MODE: running the full chain, coverage ignored."
          elif [ "$n" = "0" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "No open uncovered window -- nothing to do."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            jq -c '.actionable[0]' watch.json > window.json
          fi

      - name: Sync
        if: steps.watch.outputs.proceed == 'true'
        run: python -m scripts.run_sync

      - name: Capture the tracked logs first (tier-1.5 duty, before anything can fail)
        if: steps.watch.outputs.proceed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/logs
          if ! git diff --cached --quiet -- data/logs; then
            git commit -m "Logs: canonical-run sync capture (actions)" -- data/logs
            git pull --rebase origin main
            git push origin main || { git pull --rebase origin main && git push origin main; }
          fi

      - name: Canonical gate
        if: steps.watch.outputs.proceed == 'true'
        id: gate
        shell: bash
        run: |
          python -m scripts.canonical_gate > gate.json
          cat gate.json
          echo "verdict=$(jq -r '.verdict' gate.json)" >> "$GITHUB_OUTPUT"

      - name: Weekly report (canonical -- commits its own predictions row)
        if: steps.watch.outputs.proceed == 'true' && steps.gate.outputs.verdict == 'CANONICAL_OK' && env.MODE != 'force-report'
        run: python -m scripts.weekly_report --canonical --skip-sync --embed

      - name: Weekly report (report-only -- artifact for the human, no canonical row)
        if: steps.watch.outputs.proceed == 'true' && (steps.gate.outputs.verdict == 'REPORT_ONLY' || (steps.gate.outputs.verdict == 'CANONICAL_OK' && env.MODE == 'force-report'))
        run: python -m scripts.weekly_report --skip-sync --embed

      - name: Upload the report artifact
        id: artifact
        if: always() && steps.watch.outputs.proceed == 'true' && steps.gate.outputs.verdict != 'ABORT'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: data/decisions/**
          if-no-files-found: ignore
          retention-days: 90

      - name: Job summary (the proactive pointer -- verdict, window, artifact link)
        if: always() && steps.watch.outputs.proceed == 'true'
        shell: bash
        run: |
          verdict=$(jq -r '.verdict' gate.json 2>/dev/null || echo UNKNOWN)
          {
            echo "## Canonical run: $verdict"
            echo ""
            echo "- **Window:** $(jq -r '.name' window.json) (deadline $(jq -r '.deadline' window.json))"
            echo "- **Gate:** $(jq -r '.benign_count' gate.json 2>/dev/null || echo '?') benign, $(jq -r '.blocking | length' gate.json 2>/dev/null || echo '?') blocking; pool $(jq -r '.baselines_count' gate.json 2>/dev/null || echo '?')"
            if [ -n "${{ steps.artifact.outputs.artifact-url }}" ]; then
              echo "- **Report:** [download the artifact](${{ steps.artifact.outputs.artifact-url }}) (the *_embed.html inside is the full self-contained report)"
            fi
            [ "$MODE" = "force-report" ] && echo "- Manual **force-report** run: no canonical row was committed, by design."
            [ "$MODE" = "force-canonical" ] && echo "- Manual **force-canonical** run: on CANONICAL_OK the committed row SUPERSEDES this window's previous record (last-canonical-wins)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or close the remediation issue
        if: always() && steps.watch.outputs.proceed == 'true' && env.MODE != 'force-report'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          verdict=$(jq -r '.verdict' gate.json 2>/dev/null || echo UNKNOWN)
          week=$(jq -r '.target_week' watch.json)
          wname=$(jq -r '.name' window.json)
          title="Canonical run needs you: week ${week} ${wname}"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "$verdict" = "CANONICAL_OK" ]; then
            [ -n "$num" ] && gh issue close "$num" --comment "Resolved: this window's canonical row is committed. Report: ${ARTIFACT_URL:-see the run's Artifacts section}."
            exit 0
          fi
          python -m scripts.canonical_gate --compose-issue gate.json window.json > issue_body.md
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file issue_body.md
          else
            gh issue create --title "$title" --body-file issue_body.md
          fi
          if [ "$verdict" = "ABORT" ] || [ "$verdict" = "UNKNOWN" ]; then
            echo "gate verdict $verdict -- failing loud as designed"
            exit 1
          fi
