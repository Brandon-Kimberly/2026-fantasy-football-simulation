# Automated paired move evaluations (owner request, 2026-09-06): the last
# human-memory dependency. Every real roster move is auto-ingested with a frozen
# projection snapshot (data-capture, 13:43 UTC daily); this runs 45 minutes later and
# evaluates the backlog -- the paired-simulation Champ%/Playoff% delta that makes
# January's decision-quality analysis possible. Relying on the owner to run
# --evaluate-unevaluated across ~290 season moves is the same brittleness the
# canonical-run automation eliminated for windows.
#
# Design notes:
#   * --limit 12 bounds the run (~5-8 min per paired evaluation); an above-average
#     day's backlog drains within a day or two, and the weekly digest's housekeeping
#     section remains the visible backlog meter either way.
#   * Contemporaneity lives in the SNAPSHOT (frozen at ingestion), not the evaluation
#     timestamp -- evaluating <=1 day after the move is well inside useful.
#   * Evaluation records append to the tracked decision log and push through the same
#     union-merge machinery as every other capture; a concurrent local evaluation of
#     the same move is harmless (readers keep one record per transaction_id).
#   * ubuntu on purpose: evaluations are paired DELTAS with standard errors, not
#     golden-compared artifacts; platform is statistically inert here and the runner
#     is faster.
name: evaluate-moves
on:
  schedule:
    - cron: "28 14 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: max evaluations this run
        default: "12"
      fail-for-test:
        description: force a failure to verify the alarm fires (never used in normal operation)
        default: "no"

permissions:
  contents: write
  issues: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
      ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt
      - name: Deliberate failure (alarm test only)
        if: inputs.fail-for-test == 'yes'
        run: |
          echo "fail-for-test requested -- verifying the failure alarm end-to-end"
          exit 1
      - name: Exit early when the backlog is empty
        id: backlog
        shell: bash
        # The checkout already carries the capture run's freshly-pushed decision log
        # (13:43 UTC, 45 min earlier), so the backlog is countable WITHOUT syncing --
        # and a no-op day appends zero projection rows (owner, 2026-09-06). Drift-skips
        # persist as skip records, so a drained backlog genuinely reads zero.
        run: |
          n=$(python -c "from fantasy_sim.decisions import pending_evaluations; print(len(pending_evaluations()))")
          echo "pending=$n" >> "$GITHUB_OUTPUT"
          echo "$n pending evaluation(s)"
      - name: Sync (evaluations run against current projections)
        if: steps.backlog.outputs.pending != '0'
        run: python -m scripts.run_sync
      - name: Evaluate the unevaluated backlog
        if: steps.backlog.outputs.pending != '0'
        run: python -m scripts.evaluate_move --evaluate-unevaluated --limit ${{ inputs.limit || '12' }}
      - name: Commit and push the evaluation records
        if: steps.backlog.outputs.pending != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/logs
          if git diff --cached --quiet -- data/logs; then
            echo "no new records this run"
            exit 0
          fi
          git commit -m "Logs: automated move evaluations (actions)" -- data/logs
          git pull --rebase origin main
          git push origin main || { git pull --rebase origin main && git push origin main; }
      - name: Alarm on failure (issue -> phone)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Automation failure: evaluate-moves"
          link="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The scheduled evaluate-moves run failed: $link
      
          At risk: nothing is lost immediately -- the evaluation backlog persists and drains when a run succeeds -- but repeated failures delay the paired-evaluation record.
      
          Usually self-heals on the next scheduled run; read the failing step's log at the link. This issue auto-closes when a run succeeds."
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again: $link"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Clear the failure alarm on success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Automation failure: evaluate-moves"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          [ -n "$num" ] && gh issue close "$num" --comment "Recovered: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} succeeded." || true
