[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-sim"
version = "4.1.0"
description = "Monte Carlo fantasy football simulation, calibration, and backtesting for an 8-team IDP Sleeper league."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Brandon Kimberly" }]
requires-python = ">=3.10"
dependencies = [
    "requests",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "espn_api",
]

# Property-based testing for the Phase 1 invariant suite (tests/test_invariants.py).
# Optional, and handled the same way as espn_api: without it those tests skip cleanly rather
# than erroring, so `pip install -r requirements.txt` still leaves a runnable suite.
[project.optional-dependencies]
test = ["hypothesis"]

[tool.setuptools]
packages = ["fantasy_sim", "fantasy_sim.clients"]

[project.urls]
Repository = "https://github.com/Brandon-Kimberly/2026-fantasy-football-simulation"
"Sample report" = "https://brandon-kimberly.github.io/2026-fantasy-football-simulation/sample/weekly_report_sample.html"
Changelog = "https://github.com/Brandon-Kimberly/2026-fantasy-football-simulation/blob/main/CHANGELOG.md"
